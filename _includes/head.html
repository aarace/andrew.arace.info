<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% feed_meta %}
<link rel="stylesheet" href="https://arace.info/style.css">
<link rel="icon" href="/favicon.ico">
<style>
  .layout { display:grid; grid-template-columns:180px minmax(0, 700px); justify-content:center; column-gap:2rem; }
  .layout > .container { margin:0; width:100%; }
  .sidebar { position:sticky; top:0; align-self:start; padding:2.5rem 0 2rem 1.5rem; }
  .sidebar nav a, .sidebar a.sidebar-home { display:block; margin:0; font-size:0.9rem; color:#888; text-decoration:none; }
  .sidebar nav a:hover { color:#1a1a1a; }
  .sidebar-home { display:flex !important; align-items:center; gap:0.6rem; margin-bottom:1.5rem !important; color:#1a1a1a !important; font-weight:600; }
  .sidebar-home img { width:32px; height:32px; border-radius:50%; object-fit:cover; }
  .sidebar nav { display:flex; flex-direction:column; gap:0.4rem; padding-left:0.75rem; border-left:1px solid #e8e8e8; }
  .sidebar nav a.active { color:#1a1a1a; font-weight:600; }
  .sidebar-coffee { margin-top:1.5rem; }
  .coffee-bottom { display:none; margin-top:2.5rem; }
  .coffee .bmc-btn { min-width:0; height:36px; padding:0 12px; font-size:14px; line-height:1; border-radius:8px; }
  .coffee .bmc-btn svg { height:20px !important; }
  @media (max-width: 900px) {
    .sidebar-coffee { display:none; }
    .coffee-bottom { display:block; }
    .layout { display:block; }
    .layout > .container { margin:0 auto; padding-top:1rem; }
    .sidebar { position:static; max-width:700px; margin:0 auto; padding:1.5rem 1.5rem 0; }
    .sidebar-home { margin-bottom:0.75rem !important; }
    .sidebar nav { flex-direction:row; flex-wrap:wrap; gap:0.4rem 1.25rem; padding:0 0 0.75rem; border-left:0; border-bottom:1px solid #e8e8e8; }
  }
  .meta { font-size:0.8rem; color:#aaa; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.5rem; }
  .meta a { color:#aaa; }
  .page-nav { display:flex; justify-content:space-between; gap:1rem; margin-top:2.5rem; font-size:0.85rem; }
  .page-nav a { color:#aaa; text-decoration:none; }
  .page-nav a:hover { text-decoration:underline; }
  .page-nav .next { margin-left:auto; text-align:right; }
</style>
